<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thi trực tuyến – Trường Thcs Và Thpt Nguyễn Thị Một</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --c: #1d4ed8; --c-d: #1e3a8a; --c-l: #eff4ff; --accent: #facc15; --red: #c8102e; --green: #15803d;
    --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --bg: #f1f5fb; --card: #fff;
  }
  :root { --c: #1565c0; --c-d: #0d3c7a; --c-l: #eaf3fe; --accent: #f2b705; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 'Be Vietnam Pro', system-ui, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 48px; }
  .hero { background: linear-gradient(135deg, var(--c-d), var(--c)); color: #fff; padding: 28px 16px 64px; text-align: center; }
  .hero img { width: 64px; height: 64px; object-fit: contain; display: block; margin: 0 auto 10px; }
  .hero .org { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; opacity: .9; font-weight: 600; }
  .hero h1 { font-size: 20px; line-height: 1.4; margin: 10px auto 0; max-width: 680px; font-weight: 700; }
  .card { background: var(--card); border-radius: 16px; box-shadow: 0 4px 24px rgba(15, 23, 42, .08); padding: 20px; margin-top: 16px; }
  .hero + .wrap .card:first-child { margin-top: -44px; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #dcfce7; color: var(--green); }
  .badge.off { background: #fee2e2; color: var(--red); }
  .rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 14px 0 4px; }
  .rule { background: var(--c-l); border-radius: 12px; padding: 10px; }
  .rule b { display: block; font-size: 17px; color: var(--c-d); }
  .rule span { font-size: 12px; line-height: 1.35; display: block; color: var(--muted); }
  label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; }
  label small { font-weight: 400; color: var(--muted); }
  input { width: 100%; font: inherit; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); }
  input:focus { outline: none; border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent); }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 14px; font: 600 16px 'Be Vietnam Pro', sans-serif; cursor: pointer; background: var(--c); color: #fff; margin-top: 18px; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn.ghost { background: var(--c-l); color: var(--c-d); }
  .btn.red { background: var(--red); }
  .err { color: var(--red); background: #fef2f2; border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 14px; display: none; }
  .note { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .ghichu { font-size: 14px; background: #fffbeb; border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 12px; margin-top: 12px; white-space: pre-line; }
  .sched { width: 100%; border-collapse: collapse; font-size: 14px; }
  .sched td { padding: 8px 4px; border-top: 1px solid var(--line); }
  /* exam */
  .bar { position: sticky; top: 0; z-index: 5; background: var(--c-d); color: #fff; }
  .bar .in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .timer { font: 700 20px 'Be Vietnam Pro'; font-variant-numeric: tabular-nums; background: rgba(255,255,255,.15); padding: 4px 12px; border-radius: 10px; }
  .timer.warn { background: var(--red); }
  .prog { height: 4px; background: rgba(255,255,255,.2); }
  .prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .q .qn { font-size: 13px; font-weight: 700; color: var(--c); text-transform: uppercase; letter-spacing: .05em; }
  .q .qt { font-weight: 600; margin: 6px 0 12px; }
  .opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; font: inherit; color: inherit; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 8px; cursor: pointer; }
  .opt .l { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--c-l); color: var(--c-d); }
  .opt.sel { border-color: var(--c); background: var(--c-l); }
  .opt.sel .l { background: var(--c); color: #fff; }
  /* result */
  .score { text-align: center; }
  .score .big { font-size: 56px; font-weight: 700; color: var(--c-d); line-height: 1.1; }
  .score .big small { font-size: 24px; color: var(--muted); }
  #certImg { width: 100%; border-radius: 12px; margin-top: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.15); }
  .hide { display: none !important; }
  .loading { text-align: center; padding: 60px 0; color: var(--muted); }
</style>
</head>
<body>

<div class="hero">
  <img id="heroLogo" alt="" class="hide">
  <div class="org" id="org">&nbsp;</div>
  <h1 id="title">Đang tải…</h1>
</div>

<div class="wrap" id="vHome">
  <div class="card loading" id="loadCard">Đang tải thông tin cuộc thi…</div>
  <div class="card hide" id="homeCard">
    <div id="status"></div>
    <div class="rules" id="rules"></div>
    <div class="ghichu hide" id="ghiChu"></div>
    <form id="fInfo" class="hide" autocomplete="on">
      <label for="ma" id="lbMa">Số điện thoại</label>
      <input id="ma" placeholder="" maxlength="30" required>
      <label for="hoTen">Họ và tên</label>
      <input id="hoTen" placeholder="VD: Nguyễn Văn An" maxlength="80" required>
      <div id="boxNamSinh">
        <label for="namSinh">Năm sinh <small>(không bắt buộc)</small></label>
        <input id="namSinh" type="number" inputmode="numeric" placeholder="VD: 2010" min="1940" max="2030">
      </div>
      <label for="donVi" id="lbDonVi">Đơn vị</label>
      <input id="donVi" placeholder="" maxlength="150" required>
      <div class="err" id="errHome"></div>
      <button class="btn" id="btnStart" type="submit">Vào thi</button>
      <div class="note">Họ tên và <span id="ntDonVi">đơn vị</span> sẽ được in trên giấy chứng nhận, vui lòng ghi đúng chính tả, có dấu.</div>
    </form>
  </div>
  <div class="card hide" id="schedCard">
    <h2>Lịch thi</h2>
    <table class="sched" id="sched"></table>
  </div>
</div>

<div id="vExam" class="hide">
  <div class="bar">
    <div class="in"><div><b id="exDot"></b><div style="font-size:13px;opacity:.85" id="exProg"></div></div><div class="timer" id="timer">--:--</div></div>
    <div class="prog"><i id="progBar"></i></div>
  </div>
  <div class="wrap">
    <div id="qList"></div>
    <div class="card q hide" id="predCard">
      <div class="qn">Câu dự đoán</div>
      <div class="qt" id="predQ"></div>
      <input id="duDoan" type="number" inputmode="numeric" min="0" placeholder="Nhập một con số">
    </div>
    <div class="err" id="errExam"></div>
    <button class="btn red" id="btnSubmit">Nộp bài</button>
  </div>
</div>

<div class="wrap hide" id="vResult">
  <div class="card score">
    <div id="rsTitle" style="font-weight:600"></div>
    <div class="big" id="rsScore"></div>
    <div id="rsBadge" style="margin-top:8px"></div>
    <div class="note" id="rsNote"></div>
  </div>
  <div class="card hide" id="certCard">
    <h2>Giấy chứng nhận</h2>
    <div class="note" style="margin-top:0">Bấm <b>Tải về</b> để lưu. Nếu đang mở trong Zalo/Facebook mà không tải được, hãy <b>nhấn giữ vào ảnh</b> rồi chọn Lưu ảnh.</div>
    <img id="certImg" alt="Giấy chứng nhận">
    <button class="btn" id="btnDl">Tải về</button>
  </div>
  <button class="btn ghost" onclick="location.reload()">Về trang đầu</button>
</div>

<canvas id="cv" width="1240" height="1754" class="hide"></canvas>

<script>
var APP = { info: null, exam: null, answers: {}, timerId: null, endAt: 0, submitting: false };
var $ = function (id) { return document.getElementById(id); };

/* Gọi máy chủ: trong Apps Script dùng google.script.run; trên trang ngoài (GitHub Pages) gọi API_URL. */
var API_URL = 'https://script.google.com/macros/s/AKfycbwrmgRHKhE_FA-twmlgOPnpjQYSCqGOBlufmcdI0udy0KHvOQK4EO7et6vx_nWZol3PaA/exec';
var MA_THU = ''; /* chỉ có ở trang thử nghiệm (tao_truong.py web --thu-nghiem) */
function goi(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  var lan = 0;
  function mot() {
    if (window.google && google.script && google.script.run) {
      return new Promise(function (ok, fail) {
        var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) {
          var err = new Error((e && e.message ? e.message : String(e)).replace(/^Error:\s*/, '')); err.logic = true; fail(err);
        });
        r[fn].apply(r, args);
      });
    }
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (res) { if (!res.ok) throw new Error('Máy chủ đang bận (HTTP ' + res.status + ')'); return res.json(); })
      .then(function (j) { if (!j.ok) { var e = new Error(j.error); e.logic = true; throw e; } return j.data; });
  }
  function thu() {
    return mot().catch(function (e) {
      var tam = !e.logic || /bận|Service invoked too many|timed out|quá nhiều/i.test(e.message);
      if (tam && lan < 3) { lan++; return new Promise(function (r) { setTimeout(r, 1500 * lan + Math.random() * 1500); }).then(thu); }
      if (!e.logic && !/bận/.test(e.message)) e.message = 'Không kết nối được máy chủ, vui lòng kiểm tra mạng và thử lại.';
      throw e;
    });
  }
  return thu();
}
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function hien(id) {
  ['vHome', 'vExam', 'vResult'].forEach(function (v) { $(v).classList.toggle('hide', v !== id); });
  document.querySelector('.hero').classList.toggle('hide', id === 'vExam');
  window.scrollTo(0, 0);
}
function loi(id, msg) { var e = $(id); e.textContent = msg || ''; e.style.display = msg ? 'block' : 'none'; }
function luu(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function doc(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function nhieuDot() { return APP.info && APP.info.lichThi && APP.info.lichThi.length > 1; }
function tenDot(n) { return nhieuDot() ? 'Đợt ' + n : 'Bài thi'; }

/* ---------- Trang đầu ---------- */
(MA_THU ? goi('layThongTinCuocThi', MA_THU) : goi('layThongTinCuocThi')).then(function (t) {
  APP.info = t;
  var f = t.form || {};
  document.title = (t.donViToChuc ? t.donViToChuc + ' – ' : '') + 'Thi trực tuyến';
  $('org').textContent = t.donViToChuc || '';
  $('title').textContent = t.tenCuocThi || 'Cuộc thi trực tuyến';
  var lg = t.logo || LOGO_DOAN;
  if (lg) { $('heroLogo').src = lg; $('heroLogo').classList.remove('hide'); }
  // nhãn ô nhập theo cấu hình từng trường
  $('lbMa').textContent = f.nhanMa || 'Số điện thoại';
  $('ma').placeholder = f.goiYMa || '';
  if (f.kieuMa === 'SDT') { $('ma').type = 'tel'; $('ma').inputMode = 'numeric'; $('ma').maxLength = 12; }
  $('lbDonVi').textContent = f.nhanDonVi || 'Đơn vị';
  $('ntDonVi').textContent = (f.nhanDonVi || 'đơn vị').toLowerCase();
  $('donVi').placeholder = f.goiYDonVi || '';
  $('boxNamSinh').classList.toggle('hide', f.hoiNamSinh === false);
  if (t.ghiChuTrangDau) { $('ghiChu').textContent = t.ghiChuTrangDau; $('ghiChu').classList.remove('hide'); }

  $('loadCard').classList.add('hide');
  $('homeCard').classList.remove('hide');
  if (t.thuNghiem && t.thuNghiem.hetHan) {
    $('status').innerHTML = '<span class="badge off">Link thử nghiệm đã khóa</span>' +
      '<div class="note">Link thử chỉ dùng trước giờ mở đề. Thi thật tại link chính thức của nhà trường.</div>';
  } else if (t.dangMo) {
    $('status').innerHTML = '<span class="badge">Đang mở' + (nhieuDot() ? ' · Đợt ' + t.dangMo.dot : '') + '</span>' +
      (t.thuNghiem ? '<div class="note"><b>Bản thử nghiệm</b>: dùng đúng đề và máy chủ thật, bài ghi vào Sheet với tên "THI THỬ - …", không tính lượt thi thật. Tự khóa lúc ' + esc(t.thuNghiem.dongLuc) + '.</div>'
        : '<div class="note">Từ ' + esc(t.dangMo.batDau) + ' đến ' + esc(t.dangMo.ketThuc) + '</div>');
    $('fInfo').classList.remove('hide');
  } else if (t.sapToi) {
    $('status').innerHTML = '<span class="badge off">Chưa đến giờ thi</span>' +
      '<div class="note">' + (nhieuDot() ? 'Đợt ' + t.sapToi.dot + ' m' : 'M') + 'ở đề lúc <b>' + esc(t.sapToi.batDau) + '</b></div>';
  } else {
    $('status').innerHTML = '<span class="badge off">' + (t.daKetThuc ? 'Cuộc thi đã kết thúc' : 'Hiện chưa có đợt thi đang mở') + '</span>';
  }
  $('rules').innerHTML =
    (t.soCauDe ? '<div class="rule"><b>' + t.soCauDe + ' câu</b><span>Trắc nghiệm mỗi đề</span></div>' : '') +
    '<div class="rule"><b>' + t.thoiGianLamBaiPhut + ' phút</b><span>Thời gian làm bài</span></div>' +
    '<div class="rule"><b>≥ ' + t.diemDat + ' câu</b><span>Đúng để được cấp chứng nhận</span></div>' +
    (t.soLuotToiDa ? '<div class="rule"><b>' + t.soLuotToiDa + ' lượt</b><span>Mỗi ' + esc((f.nhanMa || 'số điện thoại').toLowerCase()) + (nhieuDot() ? ' / đợt' : '') + '</span></div>' : '');
  if (t.lichThi && t.lichThi.length) {
    $('schedCard').classList.remove('hide');
    $('sched').innerHTML = t.lichThi.map(function (d) {
      return '<tr><td><b>' + (nhieuDot() ? 'Đợt ' + d.dot : 'Mở đề') + '</b></td><td>' + esc(d.batDau) + '<br>' + (nhieuDot() ? 'đến ' : 'Kết thúc: ') + esc(d.ketThuc) + '</td></tr>';
    }).join('');
  }
  var cu = doc('thongTinNguoiThi');
  if (cu) ['ma', 'hoTen', 'namSinh', 'donVi'].forEach(function (k) { if (cu[k]) $(k).value = cu[k]; });
}).catch(function (e) {
  $('loadCard').textContent = 'Không tải được cuộc thi: ' + e.message;
});

$('fInfo').addEventListener('submit', function (ev) {
  ev.preventDefault();
  loi('errHome');
  var f = APP.info.form || {};
  var info = { ma: $('ma').value.trim(), hoTen: $('hoTen').value.trim(), namSinh: $('namSinh').value.trim(), donVi: $('donVi').value.trim() };
  if (f.kieuMa === 'SDT' && !/^0\d{9}$/.test(info.ma.replace(/\D/g, '').replace(/^84/, '0'))) return loi('errHome', (f.nhanMa || 'Số điện thoại') + ' cần đủ 10 số, bắt đầu bằng 0.');
  luu('thongTinNguoiThi', info);
  $('btnStart').disabled = true; $('btnStart').textContent = 'Đang tải đề…';
  (MA_THU ? goi('batDauThi', info, MA_THU) : goi('batDauThi', info)).then(batDauLamBai).catch(function (e) {
    loi('errHome', e.message);
    $('btnStart').disabled = false; $('btnStart').textContent = 'Vào thi';
  });
});

/* ---------- Làm bài ---------- */
function batDauLamBai(ex) {
  APP.exam = ex; APP.answers = {};
  $('exDot').textContent = tenDot(ex.dot);
  $('qList').innerHTML = ex.cauHoi.map(function (q, i) {
    return '<div class="card q" data-id="' + q.id + '"><div class="qn">Câu ' + (i + 1) + '/' + ex.cauHoi.length + '</div>' +
      '<div class="qt">' + esc(q.noiDung) + '</div>' +
      q.luaChon.map(function (c, j) {
        var L = 'ABCDEFGH'[j];
        return '<button type="button" class="opt" data-q="' + q.id + '" data-l="' + L + '"><span class="l">' + L + '</span><span>' + esc(c) + '</span></button>';
      }).join('') + '</div>';
  }).join('');
  $('predQ').textContent = ex.cauDuDoan || 'Dự đoán số người tham gia thi?';
  $('predCard').classList.toggle('hide', !ex.coCauDuDoan);
  capNhatTienDo();
  hien('vExam');
  APP.endAt = Date.now() + ex.thoiGianLamBaiGiay * 1000;
  demGio(); APP.timerId = setInterval(demGio, 500);
  window.onbeforeunload = function () { return 'Bài thi chưa nộp. Bạn chắc chắn muốn rời trang?'; };
}

$('qList').addEventListener('click', function (ev) {
  var b = ev.target.closest('.opt'); if (!b) return;
  var q = b.getAttribute('data-q');
  APP.answers[q] = b.getAttribute('data-l');
  b.parentNode.querySelectorAll('.opt').forEach(function (o) { o.classList.toggle('sel', o === b); });
  capNhatTienDo();
});

function capNhatTienDo() {
  var n = Object.keys(APP.answers).length, t = APP.exam.cauHoi.length;
  $('exProg').textContent = 'Đã trả lời ' + n + '/' + t + ' câu';
  $('progBar').style.width = (100 * n / t) + '%';
}

function demGio() {
  var s = Math.max(0, Math.round((APP.endAt - Date.now()) / 1000));
  $('timer').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  $('timer').classList.toggle('warn', s <= 60);
  if (s <= 0) nop(true);
}

$('btnSubmit').addEventListener('click', function () { nop(false); });

function nop(hetGio) {
  if (APP.submitting) return;
  var thieu = APP.exam.cauHoi.length - Object.keys(APP.answers).length;
  var duDoan = $('duDoan').value.trim();
  if (!hetGio) {
    if (APP.exam.coCauDuDoan && !duDoan) { loi('errExam', 'Vui lòng nhập câu dự đoán trước khi nộp bài.'); $('predCard').scrollIntoView({ behavior: 'smooth' }); return; }
    if (thieu > 0 && !confirm('Bạn còn ' + thieu + ' câu chưa trả lời. Vẫn nộp bài?')) return;
  }
  APP.submitting = true; loi('errExam');
  clearInterval(APP.timerId);
  $('btnSubmit').disabled = true; $('btnSubmit').textContent = 'Đang nộp bài…';
  goi('nopBai', APP.exam.token, APP.answers, duDoan).then(function (kq) {
    window.onbeforeunload = null;
    hienKetQua(kq, hetGio);
  }).catch(function (e) {
    APP.submitting = false;
    loi('errExam', e.message);
    $('btnSubmit').disabled = false; $('btnSubmit').textContent = 'Nộp lại';
  });
}

/* ---------- Kết quả + chứng nhận ---------- */
function hienKetQua(kq, hetGio) {
  hien('vResult');
  $('rsTitle').textContent = (kq.thuNghiem ? 'Kết quả THI THỬ' : 'Kết quả') + (nhieuDot() ? ' đợt ' + kq.dot : '') + (hetGio ? ' (tự nộp khi hết giờ)' : '');
  $('rsScore').innerHTML = kq.dung + '<small>/' + kq.tong + ' câu đúng</small>';
  $('rsBadge').innerHTML = kq.dat ? '<span class="badge">ĐẠT</span>' : '<span class="badge off">CHƯA ĐẠT</span>';
  var p = Math.floor(kq.giay / 60) + ' phút ' + (kq.giay % 60) + ' giây';
  $('rsNote').textContent = 'Thời gian làm bài: ' + p + '. ' + (kq.dat ? 'Chúc mừng bạn đã hoàn thành bài thi!' : 'Cần đúng tối thiểu ' + kq.diemDat + ' câu để được cấp chứng nhận.');
  if (kq.chungNhan) veChungNhan(kq.chungNhan);
}

function veChungNhan(cn) {
  var fontsReady = document.fonts && document.fonts.load
    ? Promise.all(['700 80px "Noto Serif"', '400 40px "Noto Serif"', '700 30px "Be Vietnam Pro"'].map(function (f) { return document.fonts.load(f, 'ĐÃ HOÀN THÀNH Ữ'); }))
    : Promise.resolve();
  var logoReady = new Promise(function (ok) {
    var src = APP.info.logo || LOGO_DOAN;
    if (!src) return ok(null);
    var im = new Image(); im.onload = function () { ok(im); }; im.onerror = function () { ok(null); }; im.src = src;
  });
  Promise.all([fontsReady, logoReady]).then(function (r) {
    var c = $('cv'), g = c.getContext('2d'), W = c.width, H = c.height, logo = r[1];
    var T = THEME || {};
    var bg = g.createLinearGradient(0, 0, W, H); bg.addColorStop(0, T.certDam || '#0b5fb8'); bg.addColorStop(1, T.certNhat || '#1b8fe0');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 3;
    for (var k = 0; k < 9; k++) { g.beginPath(); for (var x = 0; x <= W; x += 20) { var y = 120 + k * 190 + Math.sin(x / 140 + k) * 40; x ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
    g.strokeStyle = 'rgba(214,170,90,.55)'; g.lineWidth = 4;
    g.beginPath(); g.arc(0, 0, 210, 0, Math.PI / 2); g.stroke(); g.beginPath(); g.arc(W, H, 260, Math.PI, 1.5 * Math.PI); g.stroke();
    g.fillStyle = '#fff'; rr(g, 60, 60, W - 120, H - 120, 26); g.fill();
    g.shadowColor = 'rgba(0,0,0,.12)'; g.shadowBlur = 24; g.shadowOffsetY = 6;
    g.fillStyle = '#fffdf8'; rr(g, 130, 240, W - 260, H - 400, 22); g.fill();
    g.shadowColor = 'transparent';
    g.strokeStyle = '#d6aa5a'; g.lineWidth = 3; rr(g, 150, 260, W - 300, H - 440, 16); g.stroke();
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.fillStyle = T.certChu || '#0b4fa0'; g.font = '700 30px "Be Vietnam Pro", sans-serif';
    viet(g, (APP.info.donViToChuc || '').toUpperCase(), W / 2, 150, W - 200, 40);
    var cy = 400;
    if (logo) { var s = 250, ratio = logo.width / logo.height; g.drawImage(logo, W / 2 - s * ratio / 2, cy - s / 2, s * ratio, s); }
    else veBieuTuong(g, W / 2, cy, 110);
    var y = 690;
    g.fillStyle = '#111'; g.font = '700 104px "Noto Serif", serif'; g.fillText('CHỨNG NHẬN', W / 2, y);
    y += 190; g.font = '700 66px "Noto Serif", serif';
    y = viet(g, cn.hoTen.toUpperCase(), W / 2, y, W - 360, 80);
    y += 100; g.font = '400 44px "Noto Serif", serif';
    var mau = (APP.info.form && APP.info.form.mauDonViCN) || '{donVi}';
    y = viet(g, mau.replace('{donVi}', cn.donVi), W / 2, y, W - 360, 58);
    y += 150; g.fillStyle = '#c8102e'; g.font = '700 54px "Noto Serif", serif'; g.fillText('ĐÃ HOÀN THÀNH', W / 2, y);
    y += 100; g.font = '700 42px "Noto Serif", serif';
    y = viet(g, (APP.info.noiDungChungNhan || APP.info.tenCuocThi) + (nhieuDot() ? ' – Đợt ' + cn.dot : ''), W / 2, y, W - 340, 58);
    g.fillStyle = '#334155'; g.font = 'italic 400 34px "Noto Serif", serif';
    g.fillText((APP.info.diaDanh ? APP.info.diaDanh + ', ' : '') + cn.ngay, W / 2, H - 270);
    g.fillStyle = '#94a3b8'; g.font = '500 24px "Be Vietnam Pro", sans-serif';
    g.fillText('Mã chứng nhận: ' + cn.ma, W / 2, H - 220);
    var url = c.toDataURL('image/png');
    $('certImg').src = url;
    $('certCard').classList.remove('hide');
    $('btnDl').onclick = function () {
      var a = document.createElement('a');
      a.href = url; a.download = 'Chung-nhan-' + cn.ma + '.png';
      document.body.appendChild(a); a.click(); a.remove();
    };
  });
}

function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

function viet(g, text, x, y, maxW, lh) {
  var words = String(text).split(/\s+/), line = '', lines = [];
  words.forEach(function (w) { var t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; });
  if (line) lines.push(line);
  lines.forEach(function (l, i) { g.fillText(l, x, y + i * lh); });
  return y + (lines.length - 1) * lh;
}

function sao(g, cx, cy, R, r) {
  g.beginPath();
  for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r : R; g.lineTo(cx + rad * Math.cos(a), cy + rad * Math.sin(a)); }
  g.closePath(); g.fill();
}

function veBieuTuong(g, cx, cy, R) {
  g.fillStyle = '#1f7a3a'; g.beginPath(); g.arc(cx, cy, R, 0, 2 * Math.PI); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(cx, cy, R * .86, 0, 2 * Math.PI); g.fill();
  g.fillStyle = '#da251d'; g.beginPath(); g.arc(cx, cy, R * .78, 0, 2 * Math.PI); g.fill();
  g.fillStyle = '#ffde00'; sao(g, cx, cy, R * .5, R * .2);
}
</script>
